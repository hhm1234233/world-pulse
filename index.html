<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="世界脉搏">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>世界脉搏 · World Pulse</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23007aff'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='white' stroke-width='7'/%3E%3Cellipse cx='90' cy='90' rx='20' ry='46' fill='none' stroke='white' stroke-width='7'/%3E%3Cpath d='M46 74h88M46 106h88' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23007aff'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='white' stroke-width='8'/%3E%3Cellipse cx='90' cy='90' rx='20' ry='46' fill='none' stroke='white' stroke-width='8'/%3E%3Cpath d='M46 74h88M46 106h88' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f2f7; --bg-elev:#ffffff; --card:#ffffff;
  --label:#000000; --label2:#3c3c4399; --label3:#3c3c434d;
  --sep-thin:#3c3c431f;
  --accent:#007aff; --red:#ff3b30; --orange:#ff9500; --green:#34c759;
  --purple:#af52de; --indigo:#5856d6; --teal:#30b0c7;
  --fill:#78788033; --fill2:#7878801f;
  --blur-bg:rgba(242,242,247,.72);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --bg-elev:#1c1c1e; --card:#1c1c1e;
    --label:#ffffff; --label2:#ebebf599; --label3:#ebebf54d;
    --sep-thin:#54545845;
    --accent:#0a84ff; --red:#ff453a; --orange:#ff9f0a; --green:#30d158;
    --purple:#bf5af2; --indigo:#5e5ce6; --teal:#40c8e0;
    --fill:#7878805c; --fill2:#7878803d;
    --blur-bg:rgba(20,20,22,.72);
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
a{color:inherit;text-decoration:none}

.nav{
  position:sticky; top:0; z-index:50;
  padding:calc(env(safe-area-inset-top) + 6px) 0 0;
  background:var(--blur-bg);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  backdrop-filter:saturate(180%) blur(24px);
  transition:box-shadow .25s ease;
}
.nav.scrolled{box-shadow:0 .5px 0 var(--sep-thin)}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 2px;gap:12px}
.nav-compact{font-size:17px;font-weight:600;letter-spacing:-.2px;opacity:0;transform:translateY(6px);transition:.25s ease;pointer-events:none;position:absolute;left:0;right:0;text-align:center;top:calc(env(safe-area-inset-top) + 10px)}
.nav.scrolled .nav-compact{opacity:1;transform:none}
.nav.scrolled .big{opacity:0;transform:translateY(-4px);height:0;margin:0;overflow:hidden}
.big{transition:.25s ease}
h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.7px;margin:2px 0 1px}
.sub{font-size:13px;color:var(--label2);letter-spacing:-.05px;margin:0 0 2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;animation:pulse 2.4s infinite}
.dot.warn{background:var(--orange);animation:none}
.dot.err{background:var(--red);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.45)}70%{box-shadow:0 0 0 7px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}

.iconbtn{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:var(--fill2);color:var(--accent);display:grid;place-items:center;cursor:pointer;transition:.15s}
.iconbtn:active{transform:scale(.9);background:var(--fill)}
.iconbtn svg{width:18px;height:18px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.seg{display:flex;gap:2px;margin:10px 16px 12px;padding:2px;background:var(--fill2);border-radius:9px}
.seg button{flex:1;border:0;background:transparent;color:var(--label);font:inherit;font-size:13px;font-weight:500;letter-spacing:-.08px;padding:6px 4px;border-radius:7px;cursor:pointer;transition:.2s;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--bg-elev);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){.seg button[aria-selected="true"]{background:#636366}}
.seg button:active{opacity:.55}

.wrap{padding:0 16px}
.group{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:22px}
.item{display:flex;gap:12px;padding:14px 16px 14px 14px;position:relative;transition:background .15s;cursor:pointer}
.item:active{background:var(--fill2)}
.item + .item::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--sep-thin)}
.rank{flex:none;width:26px;text-align:center;padding-top:1px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--label3);letter-spacing:-.3px}
.item.top .rank{color:var(--red)}
.body{flex:1;min-width:0}
.zh{font-size:16px;font-weight:600;letter-spacing:-.25px;line-height:1.38;margin:0 0 3px;word-break:break-word}
.en{font-size:13.5px;line-height:1.4;color:var(--label2);margin:0 0 7px;letter-spacing:-.05px;word-break:break-word}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--label2)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;background:var(--fill2);font-size:11.5px;font-weight:500;line-height:1.5}
.chip svg{width:10px;height:10px}
.chip.verify{background:rgba(52,199,89,.16);color:var(--green);font-weight:600}
.chip.pay{background:var(--fill2);color:var(--label2)}
.t-wire{background:rgba(255,59,48,.15);color:var(--red);font-weight:600}
.t-record{background:rgba(88,86,214,.16);color:var(--indigo);font-weight:600}
.t-finance{background:rgba(255,149,0,.17);color:var(--orange);font-weight:600}
.t-intl{background:rgba(48,176,199,.17);color:var(--teal);font-weight:600}
.t-tech{background:rgba(175,82,222,.16);color:var(--purple);font-weight:600}
.sec{font-size:13px;font-weight:600;color:var(--label2);letter-spacing:.4px;margin:4px 4px 8px}

.state{padding:56px 24px;text-align:center;color:var(--label2);font-size:14px;line-height:1.6}
.state .spinner{width:26px;height:26px;margin:0 auto 14px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--accent);animation:spin .85s linear infinite}
.btn{display:inline-block;margin-top:16px;padding:9px 20px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.btn:active{opacity:.7}

details.diag{margin:0 16px 26px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
details.diag summary{padding:13px 16px;font-size:14px;font-weight:500;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--label)}
details.diag summary::-webkit-details-marker{display:none}
details.diag summary::after{content:"›";font-size:20px;color:var(--label3);transform:rotate(90deg);transition:.2s}
details.diag[open] summary::after{transform:rotate(-90deg)}
.diagbody{padding:0 16px 14px;font-size:12.5px;color:var(--label2)}
.drow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--sep-thin);font-variant-numeric:tabular-nums}
.ok{color:var(--green);font-weight:600}
.bad{color:var(--red);font-weight:600}
.foot{text-align:center;font-size:11.5px;color:var(--label3);padding:0 24px 30px;line-height:1.7}

#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:0;right:0;display:grid;place-items:center;pointer-events:none;z-index:60;opacity:0;transition:opacity .2s}
#ptr .spinner{width:22px;height:22px;border:2.5px solid var(--fill);border-top-color:var(--accent);border-radius:50%}
</style>
</head>
<body>

<div id="ptr"><div class="spinner"></div></div>

<header class="nav" id="nav">
  <div class="nav-compact">世界脉搏</div>
  <div class="nav-row big">
    <div style="min-width:0">
      <h1>世界脉搏</h1>
      <p class="sub"><span class="dot warn" id="dot"></span><span id="status">正在载入…</span></p>
    </div>
    <button class="iconbtn" id="refresh" aria-label="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div class="seg" id="seg" role="tablist">
    <button role="tab" data-cat="all" aria-selected="true">全部</button>
    <button role="tab" data-cat="world" aria-selected="false">国际政治</button>
    <button role="tab" data-cat="biz" aria-selected="false">经济市场</button>
    <button role="tab" data-cat="tech" aria-selected="false">科技商业</button>
  </div>
</header>

<main class="wrap" id="main">
  <div class="state"><div class="spinner"></div>正在载入最新简报…</div>
</main>

<details class="diag" id="diag" hidden>
  <summary><span>信源状态</span><span id="diagCount" style="color:var(--label2);font-weight:400"></span></summary>
  <div class="diagbody" id="diagBody"></div>
</details>

<p class="foot">
  信源分四层：<b style="color:var(--red)">通讯社</b>（路透 · 美联社 · 法新社）·
  <b style="color:var(--indigo)">记录报</b>（纽约时报 · WSJ · FT · 日经 · 卫报）·
  <b style="color:var(--orange)">财经</b>（彭博 · 经济学人 · CNBC）·
  <b style="color:var(--teal)">国际视角</b>（半岛 · BBC · 德国之声）<br><br>
  重要性 = 交叉证实的独立媒体数 × 信源层级 × 时效性。<br>
  「N 家媒体」= 该事件已被 N 家独立媒体分别报道。<br>
  「付费」= 该媒体正文需订阅，标题仍可见。<br>
  由 GitHub Actions 每小时在服务器端抓取并翻译。
</p>

<script>
"use strict";
const REFRESH_MS = 60*60*1000;
const MAX_SHOW   = 30;
const TIER = {
  wire:   {zh:'通讯社',   cls:'t-wire'},
  record: {zh:'记录报',   cls:'t-record'},
  finance:{zh:'财经',     cls:'t-finance'},
  intl:   {zh:'国际视角', cls:'t-intl'},
  tech:   {zh:'科技',     cls:'t-tech'},
};
const CATNAME = {world:'国际', biz:'财经', tech:'科技'};

const $ = s => document.querySelector(s);
const store = (()=>{ const mem={};
  try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t');
    return {get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
            set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
  }catch(e){ return {get:k=>mem[k]??null, set:(k,v)=>{mem[k]=v}}; }
})();

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ts){
  const m = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(m < 1) return '刚刚';
  if(m < 60) return m + ' 分钟前';
  const h = Math.round(m/60);
  if(h < 24) return h + ' 小时前';
  return Math.round(h/24) + ' 天前';
}
const clockCN = ts => new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});

let DATA = null, curCat = 'all', loading = false;

async function load(manual){
  if(loading) return;
  loading = true;
  $('#refresh').firstElementChild.classList.add('spin');
  setStatus(DATA ? '正在检查更新…' : '正在载入…', 'warn');
  try{
    const res = await fetch('data.json?t=' + Math.floor(Date.now()/60000), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if(!j || !j.stories) throw new Error('bad payload');
    DATA = j;
    store.set('wp_data', JSON.stringify(j));
    render(); renderDiag();
    setStatus(`${clockCN(j.updatedAt)} 更新 · ${j.sourceOk}/${j.sourceTotal} 信源 · ${j.stories.length} 条事件`,
              j.sourceOk >= j.sourceTotal*0.6 ? '' : 'warn');
  }catch(e){
    if(DATA){
      setStatus(`${clockCN(DATA.updatedAt)} 更新（本次刷新失败）`, 'warn');
    }else{
      const cached = store.get('wp_data');
      let ok = false;
      if(cached){ try{ DATA = JSON.parse(cached); render(); renderDiag();
        setStatus(`离线缓存 · ${clockCN(DATA.updatedAt)} 的数据`, 'warn'); ok = true; }catch(_){} }
      if(!ok) showSetupHint(e);
    }
  }
  loading = false;
  $('#refresh').firstElementChild.classList.remove('spin');
}

function showSetupHint(e){
  setStatus('还没有数据', 'err');
  $('#main').innerHTML = `<div class="state">
    <p style="font-size:15px;color:var(--label);font-weight:600">还没有 data.json</p>
    <p>说明每小时抓取的 GitHub Action 还没成功跑过第一次。<br>
    到仓库的 <b>Actions</b> 标签页，手动点一次 <b>Run workflow</b>，<br>
    等它跑完（约 1 分钟）再回来刷新。</p>
    <p style="font-size:12px;color:var(--label3);margin-top:14px">${esc((e && e.message) || '')}</p>
    <button class="btn" onclick="load(true)">重试</button></div>`;
  $('#diag').hidden = true;
}

function render(){
  const list = (DATA.stories || [])
    .filter(s => curCat === 'all' || s.cat === curCat || (s.cats || []).indexOf(curCat) > -1)
    .slice(0, MAX_SHOW);
  if(!list.length){ $('#main').innerHTML = `<div class="state">该分类暂无内容</div>`; return; }
  const head = list.slice(0,5), rest = list.slice(5);
  $('#main').innerHTML =
    `<div class="sec">头条 · 全球最受关注</div><div class="group">${head.map((s,i)=>row(s,i+1,true)).join('')}</div>` +
    (rest.length ? `<div class="sec">其他重要动态</div><div class="group">${rest.map((s,i)=>row(s,i+6,false)).join('')}</div>` : '');
}

function row(s, rank, top){
  const t = TIER[s.topTier] || TIER.intl;
  const verified = s.n >= 2
    ? `<span class="chip verify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>${s.n} 家媒体</span>` : '';
  const srcs = s.srcs || [];
  const paid = srcs.length > 0 && srcs.every(x => x.pay);
  const names = srcs.slice(0,3).map(x=>x.zh).join(' · ') + (srcs.length > 3 ? ` +${srcs.length-3}` : '');
  return `<a class="item${top?' top':''}" href="${esc(s.link || '#')}" target="_blank" rel="noopener" data-ts="${s.newest}">
    <div class="rank">${rank}</div>
    <div class="body">
      <p class="zh">${esc(s.zh || s.en)}</p>
      ${s.zh ? `<p class="en">${esc(s.en)}</p>` : ''}
      <div class="meta">
        ${verified}
        <span class="chip ${t.cls}">${t.zh}</span>
        <span class="chip">${CATNAME[s.cat] || '国际'}</span>
        ${paid ? `<span class="chip pay">付费</span>` : ''}
        <span class="when">${ago(s.newest)}<span style="color:var(--label3)"> · </span>${esc(names)}</span>
      </div>
    </div></a>`;
}

function renderDiag(){
  const ss = DATA.sources || [];
  $('#diagCount').textContent = `${DATA.sourceOk}/${DATA.sourceTotal} 正常`;
  $('#diagBody').innerHTML = ss.map(d=>
    `<div class="drow"><span>${esc(d.zh || d.name)}<span style="color:var(--label3)"> · ${(TIER[d.tier]||{}).zh || ''}</span></span>
     <span class="${d.ok?'ok':'bad'}">${d.ok ? d.n + ' 条' : esc(d.err || '失败')}</span></div>`).join('') +
    `<div class="drow" style="margin-top:6px;padding-top:10px"><span>服务器抓取于</span><span>${clockCN(DATA.updatedAt)}（北京时间）</span></div>`;
  $('#diag').hidden = false;
}

function setStatus(txt, level){
  $('#status').textContent = txt;
  $('#dot').className = 'dot' + (level ? ' ' + level : '');
}

$('#seg').addEventListener('click', e=>{
  const b = e.target.closest('button[data-cat]'); if(!b || !DATA) return;
  [...$('#seg').children].forEach(x=>x.setAttribute('aria-selected', String(x === b)));
  curCat = b.dataset.cat; render();
  window.scrollTo({top:0, behavior:'smooth'});
});
$('#refresh').addEventListener('click', ()=>load(true));
window.addEventListener('scroll', ()=>{ $('#nav').classList.toggle('scrolled', window.scrollY > 26); }, {passive:true});

let startY = null;
window.addEventListener('touchstart', e=>{ if(window.scrollY <= 0) startY = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchmove', e=>{
  if(startY === null) return;
  const d = e.touches[0].clientY - startY;
  if(d > 0 && window.scrollY <= 0){
    $('#ptr').style.opacity = Math.min(1, d/80);
    $('#ptr').style.transform = `translateY(${Math.min(46, d*.5)}px) rotate(${d*3}deg)`;
  }
}, {passive:true});
window.addEventListener('touchend', ()=>{
  const el = $('#ptr');
  if(startY !== null && parseFloat(el.style.opacity || 0) >= 1) load(true);
  el.style.opacity = 0; el.style.transform = ''; startY = null;
}, {passive:true});

setInterval(()=>load(false), REFRESH_MS);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && DATA && Date.now() - DATA.updatedAt > REFRESH_MS) load(false);
});
setInterval(()=>{
  document.querySelectorAll('.item .when').forEach(w=>{
    const ts = +w.closest('.item').dataset.ts;
    if(ts) w.firstChild.nodeValue = ago(ts);
  });
}, 60000);

(function boot(){
  const cached = store.get('wp_data');
  if(cached){ try{ DATA = JSON.parse(cached); render(); renderDiag();
    setStatus(`${clockCN(DATA.updatedAt)} 的缓存 · 正在更新…`, 'warn'); }catch(e){} }
  load(false);
})();
</script>
</body>
</html>
